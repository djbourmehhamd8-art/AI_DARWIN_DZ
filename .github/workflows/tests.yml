name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q bot main.py tests scripts
      - name: Lint (ruff, real bugs only)
        if: matrix.python-version == '3.12'
        run: pip install ruff && ruff check bot main.py scripts tests
      - name: Shell scripts parse
        run: for f in deploy/*.sh install_termux.sh start.sh stop.sh; do bash -n "$f"; done
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Fuzz smoke (hostile input)
        run: python scripts/fuzz.py --quick
      - name: Build and verify clean release archive
        run: |
          python scripts/build_release.py --output /tmp/darwin-release.zip
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/darwin-release.zip')
          names = z.namelist()
          assert 'darwin_dz/RELEASE-MANIFEST.json' in names
          assert not any(n.endswith('/.env') or ('/.env.' in n and not n.endswith('/.env.example')) or n.endswith(('.db', '.sqlite', '.sqlite3', '.log', '.pyc')) for n in names)
          assert not any('/data/' in n and not n.endswith('/data/.gitkeep') for n in names)
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed secrets
        run: |
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- . ':!tests' ':!bot/security' ':!docs'; then
            echo "Possible secret committed"; exit 1
          fi
          test -z "$(git ls-files | grep -E '(^|/)\.env$|\.db$')" || { echo ".env or a database is tracked"; exit 1; }
